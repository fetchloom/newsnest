# Newsnest behind Caddy, which gets and renews the HTTPS certificate for you.
# 1. Point your domain's DNS A record at this server.
# 2. Copy .env.example to .env and fill it in.
# 3. docker compose up -d
#
# Images use moving tags. To pin one exactly, look up its digest (docker buildx imagetools inspect caddy:2-alpine)
# and write caddy:2-alpine@sha256:<digest>, then update it on purpose when you want a new version.
services:
  newsnest:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NEWSNEST_TRUST_PROXY: "1"
    # It only ever writes to /data.
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - newsnest-data:/data
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      NEWSNEST_DOMAIN: ${NEWSNEST_DOMAIN}
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [newsnest]
volumes:
  newsnest-data:
  caddy-data:
